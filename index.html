<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Figura 3D</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: rgba(18, 22, 28, 0.88);
      --line: rgba(255,255,255,0.12);
      --text: #f3f4f6;
      --muted: #b8c0cc;
      --accent: #e8c36a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(1200px 700px at 50% 20%, #1a2230 0%, var(--bg) 58%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
      --poster-color: transparent;
    }
    .hint {
      position: absolute;
      left: 0; right: 0;
      top: calc(14px + env(safe-area-inset-top));
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
      text-shadow: 0 1px 8px rgba(0,0,0,.6);
    }
    .dock {
      position: absolute;
      left: 12px; right: 12px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 12px 10px;
      backdrop-filter: blur(16px);
    }
    .dock h1 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .02em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 14px;
      line-height: 1.2;
      min-height: 40px;
    }
    button[aria-pressed="true"] {
      background: var(--accent);
      color: #1a1406;
      border-color: transparent;
      font-weight: 650;
    }
    .ar {
      margin-top: 8px;
      width: 100%;
      background: #223044;
    }
  </style>
</head>
<body>
  <model-viewer
    id="figura"
    src="figura.glb"
    alt="Figura en 3D"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1"
    shadow-softness="0.8"
    exposure="1"
    environment-image="neutral"
    interaction-prompt="none"
    ar
    ar-modes="webxr scene-viewer quick-look"
  ></model-viewer>
  <p class="hint">Arrastrá para girar · Pellizcá para acercar</p>
  <div class="dock">
    <h1>Textura</h1>
    <div class="row" id="texturas"></div>
    <h1 style="margin-top:10px">Luz</h1>
    <div class="row" id="luces"></div>
    <button class="ar" id="arBtn" hidden>Ver en el espacio real</button>
  </div>
  <script>
    const viewer = document.getElementById("figura");
    const originals = [];

    const texturas = [
      { id: "original", label: "Original" },
      { id: "mate", label: "Mate" },
      { id: "metalico", label: "Metálico" },
      { id: "arcilla", label: "Arcilla" }
    ];
    const luces = [
      { id: "neutral", label: "Estudio" },
      { id: "legacy", label: "Cálida" }
    ];

    function renderButtons(root, items, group) {
      root.innerHTML = "";
      items.forEach((item, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = item.label;
        b.dataset.id = item.id;
        b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
        b.addEventListener("click", () => {
          root.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false"));
          b.setAttribute("aria-pressed", "true");
          if (group === "textura") applyTexture(item.id);
          if (group === "luz") applyLight(item.id);
        });
        root.appendChild(b);
      });
    }

    function snapshotMaterials() {
      originals.length = 0;
      for (const mat of viewer.model.materials) {
        const pbr = mat.pbrMetallicRoughness;
        originals.push({
          mat,
          color: pbr.baseColorFactor.slice(),
          metal: pbr.metallicFactor,
          rough: pbr.roughnessFactor,
          tex: pbr.baseColorTexture?.texture || null
        });
      }
    }

    async function applyTexture(id) {
      if (!viewer.model) return;
      if (!originals.length) snapshotMaterials();
      for (const item of originals) {
        const pbr = item.mat.pbrMetallicRoughness;
        if (id === "original") {
          pbr.setBaseColorFactor(item.color);
          pbr.setMetallicFactor(item.metal);
          pbr.setRoughnessFactor(item.rough);
          if (pbr.baseColorTexture) pbr.baseColorTexture.setTexture(item.tex);
        } else if (id === "mate") {
          pbr.setBaseColorFactor(item.color);
          if (pbr.baseColorTexture) pbr.baseColorTexture.setTexture(item.tex);
          pbr.setMetallicFactor(0);
          pbr.setRoughnessFactor(1);
        } else if (id === "metalico") {
          pbr.setBaseColorFactor(item.color);
          if (pbr.baseColorTexture) pbr.baseColorTexture.setTexture(item.tex);
          pbr.setMetallicFactor(0.88);
          pbr.setRoughnessFactor(0.22);
        } else if (id === "arcilla") {
          if (pbr.baseColorTexture) pbr.baseColorTexture.setTexture(null);
          pbr.setBaseColorFactor([0.78, 0.58, 0.42, 1]);
          pbr.setMetallicFactor(0);
          pbr.setRoughnessFactor(0.92);
        }
      }
    }

    function applyLight(id) {
      viewer.setAttribute("environment-image", id);
      viewer.exposure = id === "legacy" ? 1.15 : 1;
    }

    viewer.addEventListener("load", () => {
      snapshotMaterials();
      renderButtons(document.getElementById("texturas"), texturas, "textura");
      renderButtons(document.getElementById("luces"), luces, "luz");
      if (viewer.canActivateAR) document.getElementById("arBtn").hidden = false;
    });

    document.getElementById("arBtn").addEventListener("click", () => viewer.activateAR());
  </script>
</body>
</html>
